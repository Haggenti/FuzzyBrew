[platformio]
description = Beer Brewing Controller - Fuzzy Logic

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	milesburton/DallasTemperature
	paulstoffregen/OneWire
	robtillaart/TM1637_RT
    robtillaart/I2C_LCD
  	tfeldmann/Blinkenlight


[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
	milesburton/DallasTemperature
	paulstoffregen/OneWire
	robtillaart/TM1637_RT
    robtillaart/I2C_LCD
  	tfeldmann/Blinkenlight

